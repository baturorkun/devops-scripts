apiVersion: v1
kind: Pod
metadata:
  name: init-container-demo
spec:
  containers:
    - name: nginx
      image: nginx
      ports:
        - containerPort: 80
      volumeMounts:
        - name: workdir
          mountPath: /usr/share/nginx/html
  # These containers are run during pod initialization
  initContainers:
    - name: busybox
      image: busybox
      command: ["/bin/sh"]
      args: ["-c", "cp -"]
      volumeMounts:
        - name: workdir
          mountPath: "/work-dir"
        - name: localdir
          mountPath: "./"
  dnsPolicy: Default
  volumes:
    - name: workdir
      emptyDir: {}