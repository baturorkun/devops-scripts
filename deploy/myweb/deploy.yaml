apiVersion: apps/v1
kind: Deployment
metadata:
  name: myweb
  labels:
      app: myweb
spec:
  selector:
    matchLabels:
      app: myweb
  template:
    metadata:
      labels:
         app: myweb
    spec:
      containers:
        - name: myweb
          image: nexus.mydomain.com/myweb:latest
          ports:
            - containerPort: 8080
              name: "http-server"
---
apiVersion: v1
kind: Service
metadata:
  name: myweb
  labels:
    app: myweb
spec:
  ports:
    - port: 8080
      name: web
  clusterIP: None
  selector:
    app: myweb