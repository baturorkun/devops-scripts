apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mongo-express
  name: mongo-express
spec:
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
      - image: mongo-express:latest
        imagePullPolicy: Always
        name: mongo-express
        ports:
          - containerPort: 8081
            protocol: TCP
        restartPolicy: Always
        env:
           - name: ME_CONFIG_MONGODB_AUTH_USERNAME
             valueFrom:
               secretKeyRef:
                 name: mongodb-secret
                 key: mongo-root-username
           - name: ME_CONFIG_MONGODB_AUTH_PASSWORD
             valueFrom:
               secretKeyRef:
                 name: mongodb-secret
                 key: mongo-root-password
           - name: ME_CONFIG_MONGODB_ADMINUSERNAME
             valueFrom:
               secretKeyRef:
                 name: mongodb-secret
                 key: mongo-root-username
           - name: ME_CONFIG_MONGODB_ADMINPASSWORD
             valueFrom:
               secretKeyRef:
                 name: mongodb-secret
                 key: mongo-root-password
           - name: ME_CONFIG_MONGODB_SERVER
             value: mongo-service
           - name: ME_CONFIG_MONGODB_ENABLE_ADMIN
             value: "true"
           - name: ME_CONFIG_BASICAUTH_USERNAME
             value: "mongoexpress"
           - name: ME_CONFIG_BASICAUTH_PASSWORD
             value: "94509450"
           - name: ME_CONFIG_MONGODB_AUTH_DATABASE
             value: myproject
           - name: ME_CONFIG_MONGODB_PORT
             value: "27017"
