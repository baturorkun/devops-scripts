  namespace: "elasticsearch"
  replicas: 1
  storageClass: "vsphere-csi-retain"
  image: harbor1.akillisebeke.lab/scada-botas/elasticsearch
  imageTag: 7.11.1

jasperreports-os:
  enabled: true
  namespace: "jasperreport"
  replicas: 1
  root_url: apps.ocp-dev.botas.lab
  image:
    registry: harbor1.akillisebeke.lab
    repository: scada-botas/jasperreports
    tag: 0.8.6

keycloak-os:
  enabled: true
  namespace: "botas-isletme"
  replicas: 1
  rabbitHost: 10.6.50.114
  host: botas-isletme.apps.ocp-dev.botas.lab
  postgresql:
    enabled: true
    image:
      registry: "harbor1.akillisebeke.lab"
      repository: "scada-botas/keycloak/postgresql"
      tag: "10.15.0"
  image:
    repository: harbor1.akillisebeke.lab/scada-botas/keycloak
    tag: 0.9.8


postgresql:
  enabled: true
  global:
    imageRegistry: "harbor1.akillisebeke.lab"
  namespace: "postgresql"
  replicas: 1
  image:
    registry: harbor1.akillisebeke.lab
    repository: scada-botas/postgresql
