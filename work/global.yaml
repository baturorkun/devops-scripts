  defaultDBs: "alarm_db,dnp_db,event_db,function_db,control_db,measurement_db,nfs_db,opc_db,modbus_db"

prestodb-os:
  enabled: true
  namespace: "prestodb"
  storageClass: "vsphere-csi-retain"
