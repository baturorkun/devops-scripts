    count: 2

rabbitmq-os:
  enabled: true
  namespace: "rabbitmq"
  storageClass: "vsphere-csi-retain"
  replicas: 2
  nodeName: 10.6.50.114
  image: harbor1.akillisebeke.lab/scada-botas/rabbitmq
  tag: 3.8.14-management

redis-os:
  enabled: true
  global:
    imageRegistry: "harbor1.akillisebeke.lab"
    storageClass: "vsphere-csi-retain"
  namespace: "redis"
  replicas: 2
